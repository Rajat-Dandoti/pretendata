name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Type-check, self-tests (checksums, seed contract, SQL in SQLite, CLI, benchmarks) and the build.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # The built app driven in headless Chrome: generate, download, score, check masking.
  smoke:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run smoke

  # Independent libraries judge the generated identifiers; VALIDATION.md must not drift from the code.
  crosscheck:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npm run crosscheck
      - run: git diff --exit-code VALIDATION.md
